# Collects prices from every store once a day and writes them to the database.
name: Collect prices

on:
  schedule:
    - cron: '37 15 * * *' # 00:37 in Korea, shortly after stores switch their daily prices
  workflow_dispatch: # also runnable by hand from the Actions tab

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the database secret
        run: test -n "$DATABASE_URL" || { echo "::error::Add the DATABASE_URL secret (Settings > Secrets and variables > Actions)."; exit 1; }
      - run: npm run db:migrate
      - run: npm run collect
